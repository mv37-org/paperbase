[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbase-chat"
version = "0.1.0"
description = "Lightweight web chat product for talking to indexed papers in paperbase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
paperbase-chat = "paperbase_chat.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperbase_chat = ["static/*", "static/assets/*", "static/chunks/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
