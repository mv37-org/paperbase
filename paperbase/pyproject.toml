[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbase"
version = "0.1.0"
description = "Hosted backend for indexing and serving scientific papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.3",
    "argon2-cffi>=23.1",
    "beautifulsoup4>=4.12",
    "cryptography>=43.0",
    "docling>=2.15",
    "fastapi>=0.115",
    "google-cloud-storage>=2.18",
    "google-genai>=0.3",
    "itsdangerous>=2.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
paperbase-api = "paperbase.api:main"
paperbase-worker = "paperbase.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperbase = ["static/*", "static/assets/*", "static/chunks/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
