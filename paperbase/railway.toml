# Railway config for the paperbase API service.
# Set the Railway service root directory to `/paperbase`.
# If Railway does not pick this file up automatically, set the service config path to `/paperbase/railway.toml`.
# Run `paperbase-worker` as a separate Railway service if you want background job processing.

"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
watchPatterns = ["/src/**", "/pyproject.toml", "/railway.toml"]

[deploy]
startCommand = "paperbase-api"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
