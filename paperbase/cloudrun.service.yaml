# Example Cloud Run service manifest for the paperbase API.
# Deploy with:
#   gcloud run services replace cloudrun.service.yaml --region=YOUR_REGION --project=YOUR_PROJECT_ID
# Best practice on Cloud Run is to attach a service account with access to Cloud SQL and GCS,
# then leave PAPERBASE_GCS_SERVICE_ACCOUNT_JSON unset.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: paperbase-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_REPOSITORY/paperbase-api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PAPERBASE_API_KEY
              value: change-me
            - name: PAPERBASE_DATABASE_URL
              value: postgresql+psycopg://postgres:postgres@YOUR_DB_HOST:5432/paperbase
            - name: PAPERBASE_STORAGE_BACKEND
              value: gcs
            - name: PAPERBASE_GCS_PROJECT
              value: YOUR_PROJECT_ID
            - name: PAPERBASE_GCS_BUCKET
              value: YOUR_BUCKET
            - name: PAPERBASE_PRESIGN_TTL_SECONDS
              value: "3600"
            - name: PAPERBASE_LATEST_SYNC_DAYS
              value: "7"
            - name: PAPERBASE_LATEST_SYNC_LIMIT_PER_CATEGORY
              value: "100"
            - name: PAPERBASE_WORKER_AUTO_SYNC_LATEST
              value: "false"
            - name: PAPERBASE_WORKER_INITIAL_SYNC_LATEST
              value: "false"
            - name: PAPERBASE_SCHEDULER_SERVICE_ACCOUNT_EMAIL
              value: paperbase-scheduler@YOUR_PROJECT_ID.iam.gserviceaccount.com
            - name: PAPERBASE_SCHEDULER_AUDIENCE
              value: https://YOUR_DOMAIN
            - name: PAPERBASE_EMBEDDING_MODEL
              value: BAAI/bge-base-en-v1.5
            - name: PAPERBASE_EMBEDDING_DIM
              value: "768"
            - name: PAPERBASE_RERANK_MODEL
              value: BAAI/bge-reranker-v2-m3
            - name: PAPERBASE_RERANK_TOP_K
              value: "50"
            # Optional Gemini query expansion for search; indexing does not call an LLM.
            - name: PAPERBASE_QUERY_EXPANSION_PROVIDER
              value: none
            - name: PAPERBASE_QUERY_EXPANSION_MODEL
              value: gemini-2.5-flash-lite
            - name: PAPERBASE_VERTEX_PROJECT
              value: YOUR_PROJECT_ID
            - name: PAPERBASE_VERTEX_LOCATION
              value: us-central1
          resources:
            limits:
              cpu: "2"
              # BGE-base (~450 MB) + BGE-reranker-v2-m3 (~2.2 GB) + docling
              # (~1.2 GB) + Python runtime state leaves ~2 GB headroom at 6Gi.
              memory: 6Gi
