# Copy to `paperbase/cloudrun.api.env.yaml` and fill in real values.
# This file is consumed by:
#   gcloud run deploy ... --env-vars-file=paperbase/cloudrun.api.env.yaml

PAPERBASE_API_KEY: change-me
PAPERBASE_DATABASE_URL: postgresql+psycopg://postgres:postgres@/paperbase?host=/cloudsql/YOUR_PROJECT_ID:YOUR_REGION:YOUR_INSTANCE
PAPERBASE_STORAGE_BACKEND: gcs
PAPERBASE_GCS_PROJECT: YOUR_PROJECT_ID
PAPERBASE_GCS_BUCKET: YOUR_BUCKET
# Prefer attaching a runtime service account with bucket access on Cloud Run.
PAPERBASE_GCS_SERVICE_ACCOUNT_JSON: ""
PAPERBASE_GCS_PUBLIC_BASE_URL: ""

PAPERBASE_LOG_FORMAT: json
PAPERBASE_LOG_LEVEL: INFO

PAPERBASE_BROWSER_ORIGIN: https://YOUR_DOMAIN
PAPERBASE_CHAT_PUBLIC_URL: https://YOUR_DOMAIN
PAPERBASE_APP_SECRET: replace-with-a-long-random-secret
PAPERBASE_BROWSER_SESSION_SECURE: "true"

PAPERBASE_PRESIGN_TTL_SECONDS: "3600"
PAPERBASE_LATEST_SYNC_DAYS: "7"
PAPERBASE_LATEST_SYNC_LIMIT_PER_CATEGORY: "100"
PAPERBASE_RESULT_TTL_DAYS: "7"

# Chat + auth integrations.
PAPERBASE_ANTHROPIC_API_KEY: ""
PAPERBASE_RESEND_API_KEY: ""
PAPERBASE_RESEND_FROM_EMAIL: Paperbase <auth@example.com>
PAPERBASE_GOOGLE_CLIENT_ID: ""
PAPERBASE_GOOGLE_CLIENT_SECRET: ""
PAPERBASE_GOOGLE_OAUTH_REDIRECT_URL: https://YOUR_DOMAIN/v1/browser/auth/google/callback

# Retrieval / ranking / summarization.
PAPERBASE_EMBEDDING_MODEL: allenai/specter2_base
PAPERBASE_EMBEDDING_DIM: "768"
PAPERBASE_RERANK_MODEL: BAAI/bge-reranker-v2-m3
PAPERBASE_RERANK_TOP_K: "50"
PAPERBASE_SUMMARY_PROVIDER: none
PAPERBASE_SUMMARY_MODEL: gemini-2.5-flash-lite
PAPERBASE_VERTEX_PROJECT: YOUR_PROJECT_ID
PAPERBASE_VERTEX_LOCATION: us-central1
PAPERBASE_LAZY_SUMMARY_ON_READ: "true"
PAPERBASE_FEATURED_TIER_CONCURRENCY: "16"
PAPERBASE_FETCH_REFERENCES_AT_INDEX: "false"
