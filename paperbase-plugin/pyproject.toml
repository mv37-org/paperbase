[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbase-plugin"
version = "0.1.0"
description = "Shared Codex and Claude Code plugin for paperbase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
paperbase-plugin-mcp = "paperbase_plugin.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
