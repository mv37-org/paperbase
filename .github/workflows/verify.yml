name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: paperbase
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paperbase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAPERBASE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/paperbase
      PAPERBASE_STORAGE_BACKEND: local
      PAPERBASE_LOCAL_STORAGE_ROOT: .paperbase-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            paperbase/pyproject.toml
            paperbase-plugin/pyproject.toml

      - name: Install vp
        run: curl -fsSL https://vite.plus | bash

      - name: Add vp to PATH
        run: echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: Setup workspace
        run: make setup

      - name: Verify repo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make test-smoke
          else
            make test
          fi
