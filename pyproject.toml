[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-paperclip"
version = "0.3.0"
description = "Search and analyze 800K+ AI/ML papers from the command line"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30"]
embed = ["sentence-transformers>=2.2"]
all = ["anthropic>=0.30", "sentence-transformers>=2.2"]

[project.scripts]
aipaper = "ai_paperclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
